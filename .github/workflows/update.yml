name: 記事データを更新

on:
  schedule:
    - cron: "0 21 * * *"     # 毎日 日本時間の朝6時ごろ(UTC 21:00)
  workflow_dispatch:          # 手動実行ボタンでもいつでも更新できる

permissions:
  contents: write             # 更新したデータをこのリポジトリに保存するため
  actions: write              # 定期実行が止まらないようにするため

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: noteから記事を取得して検索データを作る
        run: python3 build.py
        env:
          NOTE_USER: kuwaman_88      # ← noteのIDを変える場合はここ
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 変更があれば保存
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "記事に変更なし"
          else
            git commit -m "記事データを更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 公開リポジトリは60日間動きがないと定期実行が止まるため、毎回「有効化」を呼んで止まるのを防ぐ
      - name: 定期実行を維持
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
